name: Patch SSLH 1.20 compatibility
on:
  push:
    branches: [feat/transactional-architecture]
    paths: [.patch-sslh-120]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transactional-architecture
          fetch-depth: 0
      - name: Apply Bash-only SSLH argument fix
        shell: bash
        run: |
          set -Eeuo pipefail
          sed -i 's|exec "$binary" --config /etc/sslh/hextunnel.cfg|exec "$binary" -F/etc/sslh/hextunnel.cfg|' modules/ssh.sh
          grep -q 'exec "$binary" -F/etc/sslh/hextunnel.cfg' modules/ssh.sh
          ! grep -q 'exec "$binary" --config' modules/ssh.sh

          find install.sh bin lib modules tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash tests/unit/test-core.sh
          bash tests/unit/test-module-contract.sh
          bash tests/security/test-hardening.sh

          rm -f .github/workflows/patch-sslh-120.yml .patch-sslh-120
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use SSLH 1.20 compatible config argument'
          git push origin HEAD:feat/transactional-architecture
