name: ShellCheck
on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check maintained Bash source
        shell: bash
        run: |
          find . -type f -name '*.sh' \
            -not -path './legacy/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 shellcheck --severity=error
