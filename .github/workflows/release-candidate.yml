name: Release candidate
on:
  push:
    branches: ['feat/**', 'fix/**', 'release/**', 'main']
  pull_request:
permissions:
  contents: read
jobs:
  production-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install validation tools
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck jq curl ca-certificates
      - name: Resolve immutable component lock
        run: bash scripts/resolve-component-lock.sh config/component-lock.env
      - name: Run production readiness gate
        env:
          HEXTUNNEL_RELEASE_BUILD: '1'
        run: bash scripts/production-readiness.sh
      - name: Build release candidate
        run: SOURCE_DATE_EPOCH=1700000000 bash scripts/build-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: hextunnel-release-candidate
          path: |
            config/component-lock.env
            dist/*.tar.gz
            dist/*.sha256
            dist/*.files.txt
          if-no-files-found: error
          retention-days: 14
