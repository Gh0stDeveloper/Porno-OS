name: Bootstrap modular foundation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-modular-foundation
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'contrib/modular-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout contribution branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: contrib/modular-foundation
          fetch-depth: 0
          persist-credentials: true

      - name: Apply modular migration
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f src/manifest.txt ]]; then
            echo 'Modular migration already applied.'
            exit 0
          fi

          python3 tools/preprocess_install.py --root .
          python3 tools/bootstrap_modularize.py --root .
          python3 tools/build.py --check --root .
          bash -n install.sh

          while IFS= read -r module; do
            [[ -z "$module" ]] && continue
            bash -n "$module"
          done < src/manifest.txt

          python3 -m unittest discover -s tests -v
          python3 tools/secret_scan.py --root .

      - name: Commit generated modular source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .ci/migration-error.txt .modularize-trigger
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo 'No generated changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: establish modular installer foundation'
          git push origin HEAD:contrib/modular-foundation
