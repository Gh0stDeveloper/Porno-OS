name: Current tree secret scan
on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current tree without inherited Git history
        id: scan
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo --redact --exit-code=1 \
            --report-format=json --report-path=/repo/gitleaks-report.json
          code=$?
          [[ -s gitleaks-report.json ]] || printf '[]\n' > gitleaks-report.json
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-current-tree
          path: gitleaks-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail when findings exist
        if: steps.scan.outputs.exit_code != '0'
        run: exit 1
