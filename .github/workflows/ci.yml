name: CI

on:
  push:
    branches:
      - main
      - 'contrib/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate modular installer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate modular source when missing
        if: hashFiles('src/manifest.txt') == ''
        run: python3 tools/bootstrap_modularize.py --root .

      - name: Verify generated installer
        run: python3 tools/build.py --check

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          while IFS= read -r module; do
            [[ -z "$module" ]] && continue
            bash -n "$module"
          done < src/manifest.txt

      - name: Run migration tests
        run: python3 -m unittest discover -s tests -v

      - name: Scan tracked files for secrets
        run: python3 tools/secret_scan.py

      - name: Publish generated modular source
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .modularize-trigger .github/workflows/generate-modular.yml
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo 'No generated changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: generate modular installer source'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck at error severity
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --severity=error install.sh
          while IFS= read -r module; do
            [[ -z "$module" ]] && continue
            shellcheck --severity=error -s bash "$module"
          done < src/manifest.txt
