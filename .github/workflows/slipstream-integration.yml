name: SlipStream integration
on:
  push:
    branches: [feat/transactional-architecture]
    paths:
      - install.sh
      - bin/**
      - lib/**
      - modules/ssh.sh
      - modules/slowdns.sh
      - modules/slipstream.sh
      - .github/workflows/slipstream-integration.yml
  pull_request:
    paths:
      - install.sh
      - bin/**
      - lib/**
      - modules/ssh.sh
      - modules/slowdns.sh
      - modules/slipstream.sh
      - .github/workflows/slipstream-integration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slipstream-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare verified isolated DNS configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          url=https://raw.githubusercontent.com/fisabiliyusri/SLDNS/main/slowdns/sldns-server
          curl -fL --retry 3 -o /tmp/sldns-server "$url"
          sha="$(sha256sum /tmp/sldns-server | awk '{print tolower($1)}')"
          sudo install -d -m 700 /etc/hextunnel
          cat > /tmp/hextunnel.env <<EOF
          HEXTUNNEL_ALLOW_ROOT_PASSWORD=0
          HEXTUNNEL_ADMIN_IP=127.0.0.1/32
          HEXTUNNEL_SLOWDNS_NS=ns-ci.example.test
          HEXTUNNEL_SLOWDNS_LISTEN_ADDRESS=127.0.0.1
          HEXTUNNEL_SLOWDNS_LISTEN_PORT=5353
          HEXTUNNEL_SLOWDNS_BINARY_URL=$url
          HEXTUNNEL_SLOWDNS_SHA256=$sha
          HEXTUNNEL_SLIPSTREAM_DOMAIN=slip-ci.example.test
          HEXTUNNEL_SLIPSTREAM_DNS_ADDRESS=127.0.0.1
          HEXTUNNEL_SLIPSTREAM_DNS_PORT=5354
          HEXTUNNEL_SLIPSTREAM_COMMIT=bc772dd07d9a136dbd7553b0da575526de207847
          EOF
          sudo install -m 600 /tmp/hextunnel.env /etc/hextunnel/hextunnel.env
          sudo tee /etc/hextunnel/secrets.env >/dev/null <<'EOF'
          HEXTUNNEL_TELEGRAM_CHAT_ID=""
          HEXTUNNEL_TELEGRAM_BOT_TOKEN=""
          EOF
          sudo chmod 600 /etc/hextunnel/secrets.env

      - name: Install SlipStream dependency chain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -E bash ./install.sh install slipstream \
            --non-interactive --no-reboot --force \
            2>&1 | tee /tmp/slipstream-install.log

      - name: Validate DNS routing services
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl is-active --quiet ssh
          sudo systemctl is-active --quiet server-sldns
          sudo systemctl is-active --quiet danted
          sudo systemctl is-active --quiet slipstream
          sudo systemctl is-active --quiet dnsdist
          sudo runuser -u hextunnel-slowdns -- test -r /etc/slowdns/server.key
          sudo runuser -u hextunnel-slipstream -- test -r /etc/slipstream/key.pem
          sudo dnsdist --check-config -C /etc/dnsdist/dnsdist.conf >/dev/null 2>&1 \
            || sudo dnsdist --check-config >/dev/null 2>&1
          sudo ss -lunp | grep -q '127.0.0.1:5300'
          sudo ss -lunp | grep -q '127.0.0.1:5301'
          sudo ss -lunp | grep -q '127.0.0.1:5354'
          sudo grep -q '^SLOWDNS_RESTORE_ADDRESS=127.0.0.1$' /etc/slipstream/slowdns-listener.env
          sudo grep -q '^SLOWDNS_RESTORE_PORT=5353$' /etc/slipstream/slowdns-listener.env
          sudo hextunnel doctor --report /tmp/slipstream-doctor.txt
          sudo test -s /tmp/slipstream-doctor.txt
          ! sudo grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|[0-9]{8,12}:[A-Za-z0-9_-]{20,}' /tmp/slipstream-doctor.txt

      - name: Remove SlipStream and verify SlowDNS restoration
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo hextunnel uninstall slipstream 2>&1 | tee /tmp/slipstream-uninstall.log
          sudo systemctl is-active --quiet server-sldns
          sudo ss -lunp | grep -q '127.0.0.1:5353'
          ! sudo ss -lunp | grep -q '127.0.0.1:5301'
          test ! -e /etc/systemd/system/slipstream.service
          test ! -e /etc/slipstream
          sudo hextunnel uninstall slowdns ssh 2>&1 | tee -a /tmp/slipstream-uninstall.log
          test ! -e /etc/systemd/system/server-sldns.service
          test ! -e /usr/local/bin/sldns-server
          sudo ss -lntp | grep -q ':22 '

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '=== failed units ==='
            sudo systemctl --failed --no-pager
            for unit in ssh server-sldns danted slipstream dnsdist; do
              echo
              echo "=== $unit ==="
              sudo systemctl status "$unit" --no-pager -l
              sudo journalctl -u "$unit" -n 200 --no-pager
            done
            echo
            echo '=== dnsdist config ==='
            sudo sed -n '1,160p' /etc/dnsdist/dnsdist.conf
          } > /tmp/slipstream-system.log 2>&1
          sudo chmod 644 /tmp/slipstream-*.log /tmp/slipstream-doctor.txt 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-ubuntu-24.04-${{ github.run_id }}
          path: |
            /tmp/slipstream-system.log
            /tmp/slipstream-install.log
            /tmp/slipstream-uninstall.log
            /tmp/slipstream-doctor.txt
          if-no-files-found: warn
          retention-days: 7
