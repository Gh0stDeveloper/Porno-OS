name: Generate modular source

on:
  push:
    branches:
      - contrib/modular-foundation
    paths:
      - '.modularize-trigger'
      - 'tools/**'
      - 'tests/**'
      - '.gitignore'
      - 'config/secrets.env.example'

permissions:
  contents: write

concurrency:
  group: generate-modular-foundation
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout contribution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate and validate modular installer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/bootstrap_modularize.py --root .
          python3 tools/build.py --check --root .
          bash -n install.sh

          while IFS= read -r module; do
            [[ -z "$module" ]] && continue
            bash -n "$module"
          done < src/manifest.txt

          python3 -m unittest discover -s tests -v
          python3 tools/secret_scan.py --root .

      - name: Commit generated source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .modularize-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: generate modular installer source'
          git push origin HEAD:contrib/modular-foundation
