name: Patch runtime compatibility
on:
  push:
    branches: [feat/transactional-architecture]
    paths: [.patch-runtime-compat]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transactional-architecture
          fetch-depth: 0
      - name: Apply reviewed Bash compatibility fixes
        shell: bash
        run: |
          set -Eeuo pipefail

          sed -i 's|exec "$binary" -F /etc/sslh/hextunnel.cfg|exec "$binary" --config /etc/sslh/hextunnel.cfg|' modules/ssh.sh

          awk '
            /^[[:space:]]*\[\[ "\$\{HEXTUNNEL_DRY_RUN:-0\}" == 1 \]\] \|\| \\$/ {
              first=$0
              if ((getline second) <= 0) {
                print first
                next
              }
              if (second ~ /install -m 640 -o root -g hextunnel-hysteria2 \/etc\/hysteria2\/users.txt \/etc\/hysteria2\/users.txt/) {
                print "  if [[ \"${HEXTUNNEL_DRY_RUN:-0}\" != 1 ]]; then"
                print "    chown root:hextunnel-hysteria2 /etc/hysteria2/users.txt"
                print "    chmod 640 /etc/hysteria2/users.txt"
                print "  fi"
                next
              }
              print first
              print second
              next
            }
            { print }
          ' modules/hysteria2.sh > modules/hysteria2.sh.tmp
          mv modules/hysteria2.sh.tmp modules/hysteria2.sh

          grep -q 'exec "$binary" --config /etc/sslh/hextunnel.cfg' modules/ssh.sh
          grep -q 'chown root:hextunnel-hysteria2 /etc/hysteria2/users.txt' modules/hysteria2.sh
          ! grep -q 'users.txt /etc/hysteria2/users.txt' modules/hysteria2.sh

          find install.sh bin lib modules tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash tests/unit/test-core.sh
          bash tests/unit/test-module-contract.sh
          bash tests/security/test-hardening.sh

          rm -f .github/workflows/patch-runtime-compat.yml .patch-runtime-compat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: support SSLH 1.20 and Hysteria 2 ownership'
          git push origin HEAD:feat/transactional-architecture
