name: Installer dry-run
on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run transactional installer without changes
        shell: bash
        run: |
          set -o pipefail
          sudo -E bash tests/integration/test-dry-run.sh 2>&1 | tee installer-dry-run.log
      - name: Upload dry-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-dry-run-${{ github.run_id }}
          path: installer-dry-run.log
          if-no-files-found: error
          retention-days: 7
