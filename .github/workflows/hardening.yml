name: Hardening invariants
on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hardening invariants
        shell: bash
        run: |
          set -o pipefail
          bash -x tests/security/test-hardening.sh 2>&1 | tee /tmp/hextunnel-hardening.log
      - name: Upload hardening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-diagnostics-${{ github.run_id }}
          path: /tmp/hextunnel-hardening.log
          if-no-files-found: error
          retention-days: 7
