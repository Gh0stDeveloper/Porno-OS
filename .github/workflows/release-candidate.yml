name: Release candidate
on:
  push:
    branches: ['feat/**', 'fix/**', 'release/**', 'main']
  pull_request:
permissions:
  contents: read
jobs:
  production-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install validation tools
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Run production readiness gate
        run: bash scripts/production-readiness.sh
      - name: Build release candidate
        run: SOURCE_DATE_EPOCH=1700000000 bash scripts/build-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: hextunnel-release-candidate
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.files.txt
          if-no-files-found: error
          retention-days: 14
